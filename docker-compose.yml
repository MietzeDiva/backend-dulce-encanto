# Las claves salen del archivo .env (copia .env.example a .env). Ya NO hay secretos escritos aquí.
services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-dulce-encanto
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dulce-encanto-net

  ms-usuarios:
    build:
      context: ./ms-usuarios/ms-usuarios
    container_name: ms-usuarios
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_usuarios?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-Dulce2026!}
      APP_SEED_VENDEDOR_PASSWORD: ${APP_SEED_VENDEDOR_PASSWORD:-Dulce2026!}
      APP_SEED_CLIENTE_PASSWORD: ${APP_SEED_CLIENTE_PASSWORD:-Dulce2026!}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - dulce-encanto-net

  ms-productos:
    build:
      context: ./ms-productos/ms-productos
    container_name: ms-productos
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_productos?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - dulce-encanto-net

  ms-ventas:
    build:
      context: ./ms-ventas
    container_name: ms-ventas
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_ventas?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      MS_PRODUCTOS_URL: http://ms-productos:8082
    depends_on:
      mysql-db:
        condition: service_healthy
      ms-productos:
        condition: service_started
    networks:
      - dulce-encanto-net

volumes:
  mysql_data:

networks:
  dulce-encanto-net:
    driver: bridge