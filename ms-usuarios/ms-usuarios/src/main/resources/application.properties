spring.application.name=ms-usuarios
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/db_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:Dulce2026!}
app.seed.vendedor-password=${APP_SEED_VENDEDOR_PASSWORD:Dulce2026!}
app.seed.cliente-password=${APP_SEED_CLIENTE_PASSWORD:Dulce2026!}